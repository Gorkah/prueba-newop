<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEW OP · Noves Iniciatives</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --line:#e2e7ee; --line2:#eef1f5;
  --text:#18212f; --muted:#5d6878; --soft:#8a94a3;
  --accent:#2f6fde; --accent-d:#2459b8; --accent-s:#e9f0fc;
  --side:#fbfcfd; --chrome:#c9d1dc;
  --ok:#1f8a5b; --ok-s:#e3f4ec; --warn:#b7791f; --warn-s:#fbf1df;
  --bad:#c0392b; --bad-s:#fbe9e7; --info:#5a4fcf; --info-s:#eeecfb;
  --grey-s:#eef0f3;
  --r:12px; --sh:0 1px 2px rgba(20,30,50,.05),0 4px 16px rgba(20,30,50,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;color:var(--text);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:270px 1fr;height:100vh}
/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 22px;border-bottom:1px solid var(--line);margin-bottom:16px}
.mark{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#dfe5ee,#b9c4d3);display:grid;place-items:center;font-weight:700;color:#2b3646;letter-spacing:.5px}
.brand strong{display:block;font-size:17px}
.brand span{font-size:14px;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px;border:0;background:transparent;border-radius:10px;color:#2c3747;font-size:17px;text-align:left}
nav button:hover{background:var(--grey-s)}
nav button.active{background:var(--accent-s);color:var(--accent-d);font-weight:600}
nav svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .bdg{margin-left:auto;background:var(--accent);color:#fff;font-size:13px;font-weight:600;border-radius:20px;padding:1px 9px}
nav .bdg.w{background:var(--warn)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-s);color:var(--accent-d);display:grid;place-items:center;font-weight:700;font-size:15px}
.side-foot div{font-size:15px}.side-foot span{color:var(--muted);font-size:14px}
/* Main */
main{overflow:auto;padding:28px 36px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:20px}
.top h1{margin:0;font-size:30px;letter-spacing:-.3px}
.top p{margin:4px 0 0;color:var(--muted)}
.today{color:var(--muted);font-size:16px;white-space:nowrap;background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card h3{margin:0;font-size:19px}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line2)}
.card-b{padding:8px 22px 18px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{padding:20px 22px}
.kpi .l{color:var(--muted);font-size:15px}
.kpi .v{font-size:34px;font-weight:700;margin:6px 0 2px;letter-spacing:-.5px}
.kpi .s{font-size:14px;color:var(--ok)}
.kpi .s.n{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
/* Attention list */
.att{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:8px}
.att:last-child{border-bottom:0}
.att:hover{background:#f8fafc}
.att .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.att .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.att .t{flex:1}
.att .t b{font-weight:600}
.att .t small{display:block;color:var(--muted);font-size:14.5px}
.chev{color:var(--soft);font-size:22px}
.bars .row{display:grid;grid-template-columns:140px 1fr 34px;align-items:center;gap:12px;margin:12px 0;font-size:15.5px}
.bar{height:12px;border-radius:6px;background:var(--grey-s);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
/* Toolbar */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:30px;padding:8px 15px;font-size:15.5px;color:#334}
.chip:hover{border-color:var(--chrome)}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.chip em{font-style:normal;opacity:.65;margin-left:4px}
.search{flex:1;min-width:220px;max-width:380px;position:relative}
.search input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px}
.search svg{position:absolute;left:13px;top:12px;width:18px;height:18px;stroke:var(--soft);fill:none;stroke-width:2}
.sel{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 18px;font-weight:600;font-size:16px;color:var(--text);display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--chrome)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{background:var(--accent-d)}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:14px;color:var(--muted);font-weight:600;padding:14px 16px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
td{padding:15px 16px;border-bottom:1px solid var(--line2);font-size:16.5px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f7f9fc}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;color:var(--muted);font-size:14.5px}
.mono{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.tag{display:inline-block;padding:4px 11px;border-radius:20px;font-size:14px;font-weight:600;white-space:nowrap}
.t-blue{background:var(--accent-s);color:var(--accent-d)}
.t-ok{background:var(--ok-s);color:var(--ok)}
.t-warn{background:var(--warn-s);color:var(--warn)}
.t-bad{background:var(--bad-s);color:var(--bad)}
.t-info{background:var(--info-s);color:var(--info)}
.t-grey{background:var(--grey-s);color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.cb{width:20px;height:20px;accent-color:var(--accent)}
.actionbar{position:sticky;bottom:0;display:flex;align-items:center;gap:16px;padding:14px 22px;background:#fff;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
/* Fabric cards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.fab{cursor:pointer;overflow:hidden;transition:transform .12s}
.fab:hover{transform:translateY(-2px)}
.sw{height:86px;position:relative}
.sw .lbl{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.9);border-radius:6px;font-size:13px;padding:2px 8px;font-weight:600}
.fab .b{padding:14px 16px}
.fab .r{font-size:14px;color:var(--muted)}
.fab .c{font-weight:600;margin:3px 0 8px}
.fab .m{display:flex;justify-content:space-between;font-size:15px;color:#334}
/* Drawer */
#scrim{position:fixed;inset:0;background:rgba(15,23,35,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(720px,94vw);background:var(--panel);box-shadow:-10px 0 40px rgba(15,23,35,.15);transform:translateX(102%);transition:transform .25s ease;z-index:30;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:24px 28px 16px;border-bottom:1px solid var(--line)}
.dh .x{float:right;border:0;background:var(--grey-s);width:38px;height:38px;border-radius:10px;font-size:22px;color:var(--muted)}
.dh h2{margin:6px 0 4px;font-size:25px}
.dh .meta{color:var(--muted)}
.db{padding:20px 28px;overflow:auto;flex:1}
.df{padding:16px 28px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end;background:#fbfcfd}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.info div{background:#f8fafc;border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.info span{display:block;font-size:13.5px;color:var(--muted)}
.info b{font-size:17px}
.info input{width:90px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-weight:700;font-size:17px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;font-size:16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent-d);border-color:var(--accent);font-weight:600}
.resum li{margin:0 0 10px}
.note{background:#f8fafc;border-left:3px solid var(--chrome);padding:10px 14px;border-radius:6px;color:var(--muted);font-size:15px;margin-top:14px}
.esc td,.esc th{padding:10px 8px;font-size:15.5px;cursor:default}
.esc tr:hover td{background:none}
.esc .sec td{background:#f6f8fb;font-weight:600;font-size:14px;color:var(--muted)}
.esc .tot td{font-weight:700;font-size:18px;border-top:2px solid var(--line)}
.mail{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.mail .h{display:flex;justify-content:space-between;color:var(--muted);font-size:14.5px}
.mail .s{font-weight:600;margin:4px 0 8px}
.mail textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15.5px;margin-top:6px;background:#fbfcff}
.reply{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.reply label{font-size:14px;font-weight:600;color:var(--accent-d)}
.doc{border:1px solid var(--line);border-radius:10px;padding:22px 24px;background:#fff}
.doc .dt{display:flex;justify-content:space-between;margin-bottom:16px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:8px 16px;font-size:16px}
.kv span{color:var(--muted)}
/* Modal */
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(15,23,35,.38);z-index:50}
#modal.on{display:grid}
.mbox{background:#fff;border-radius:16px;width:min(560px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.mbox h3{margin:0;padding:22px 26px 6px;font-size:22px}
.mbox .mb{padding:8px 26px 20px;color:#2c3747}
.mbox .mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 26px;background:#fafbfc;border-top:1px solid var(--line)}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.notebook{background:repeating-linear-gradient(#fffef8,#fffef8 29px,#cfdcef 30px);border:1px solid #e6e1cf;border-radius:8px;padding:8px 18px 4px 46px;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:17px;line-height:30px;color:#2d3a5a;position:relative;transform:rotate(-.6deg)}
.notebook:before{content:"";position:absolute;left:32px;top:0;bottom:0;border-left:2px solid #f1b9b9}
.label{border:1px dashed #9aa6b6;border-radius:6px;padding:12px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:#fff;line-height:1.6}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:18px;height:18px;border:2.5px solid var(--accent-s);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#18212f;color:#fff;padding:14px 22px;border-radius:12px;font-size:16px;opacity:0;transition:all .25s;z-index:60;display:flex;gap:10px;align-items:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast i{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center;font-style:normal;font-size:13px}
/* Search */
.ask{display:flex;gap:12px;padding:20px 22px}
.ask input{flex:1;padding:16px 18px;border:1px solid var(--line);border-radius:12px;font-size:19px;background:#fbfcfe}
.ask input:focus,.search input:focus,.sel:focus{outline:2px solid var(--accent-s);border-color:var(--accent)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 20px}
.ans{padding:22px 24px;margin-top:18px}
.ans .q{color:var(--muted);font-size:15px;margin-bottom:8px}
.ans .a{font-size:18px}
.ans .a ul{margin:10px 0 0;padding-left:22px}
.ans .a li{margin:5px 0}
.fonts{margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fonts span{font-size:14px;color:var(--muted);margin-right:4px}
.src{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:6px 12px;font-size:14.5px;color:var(--accent-d)}
.src:hover{background:var(--accent-s)}
/* Alerts */
.alert{display:grid;grid-template-columns:70px 1fr auto auto;gap:18px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line2)}
.alert:last-child{border-bottom:0}
.alert.done{opacity:.5}
.alert.done .at b{text-decoration:line-through}
.dbox{text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 0;background:#fafbfc}
.dbox b{display:block;font-size:22px;line-height:1.1}
.dbox span{font-size:13px;color:var(--muted);text-transform:uppercase}
.at small{display:block;color:var(--muted);font-size:15px}
.who{font-size:14.5px;color:#334;background:var(--grey-s);padding:5px 12px;border-radius:20px;white-space:nowrap}
.due{font-size:14.5px;font-weight:600;min-width:120px;text-align:right}
.group{padding:14px 22px 6px;font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:#fafbfc;border-bottom:1px solid var(--line2)}
/* Correus */
.inbox{display:grid;grid-template-columns:400px 1fr;min-height:640px;overflow:hidden}
.ilist{border-right:1px solid var(--line);overflow:auto;max-height:76vh}
.im{padding:14px 18px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative}
.im:hover{background:#f8fafc}
.im.on{background:var(--accent-s)}
.im.unread:before{content:"";position:absolute;left:6px;top:22px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.im .r1{display:flex;justify-content:space-between;gap:8px;font-size:15.5px}
.im .r1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im .r1 span{color:var(--muted);font-size:14px;white-space:nowrap}
.im .sj{font-size:15px;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im .sn{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.im .tag{font-size:12.5px;padding:2px 9px;margin-top:6px}
.iview{padding:24px 28px;overflow:auto;max-height:76vh}
.iview h2{margin:0 0 6px;font-size:23px}
.ibody{white-space:pre-line;background:#fafbfc;border:1px solid var(--line2);border-radius:10px;padding:16px 18px;margin:16px 0 20px}
.draft{border:1.5px solid var(--accent);border-radius:12px;overflow:hidden}
.draft .dhd{display:flex;justify-content:space-between;align-items:center;background:var(--accent-s);padding:10px 16px;font-weight:600;color:var(--accent-d);font-size:15px}
.draft textarea{width:100%;min-height:190px;border:0;padding:14px 16px;font-size:16px;resize:vertical;line-height:1.5}
.draft .dft{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line2);background:#fbfcfd;align-items:center}
.draft .dft .fonts{margin:0;padding:0;border:0;flex:1}
.mstat{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.mini div{background:#f8fafc;border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.mini span{display:block;font-size:13.5px;color:var(--muted)}
.mini b{font-size:20px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.info{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{display:none}main{padding:18px}}
.drawer.wide{width:min(1000px,96vw)}
.docwrap{background:#e6eaf0;border-radius:12px;padding:22px;margin-top:4px}
.hint{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted);margin:0 0 12px}
.hint b{color:var(--accent-d)}
[contenteditable=true]{outline:1px dashed #9db5e0;outline-offset:-2px;background:#f7faff}
[contenteditable=true]:focus{outline:2px solid var(--accent);background:#fff}
.srcs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px;font-size:14px;color:var(--muted)}
.kvx{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 26px;margin-bottom:18px}
.kvx div{border-bottom:1px solid var(--line2);padding:6px 0}
.kvx span{display:block;font-size:13.5px;color:var(--muted)}
.kvx b{font-weight:600;font-size:16px}
.more{padding:14px 22px;color:var(--muted);font-size:15px;border-top:1px solid var(--line2)}
.logo-s{height:20px;vertical-align:-4px}
td.mono{white-space:nowrap}
/* ===== Personalització NEW OP: fons blanc, negre i sorra ===== */
:root{--bg:#ffffff;--panel:#ffffff;--line:#e6e1da;--line2:#f0ece6;--text:#141414;--muted:#5f5a54;--soft:#8d877f;
 --accent:#141414;--accent-d:#000000;--accent-s:#f3eee7;--side:#ffffff;--grey-s:#f3f1ee}
body{font-size:18px}
.side{border-right:1px solid var(--line)}
.brand{flex-direction:column;align-items:flex-start;gap:8px}
.brand img{height:46px;width:auto;display:block}
.brand span{font-size:14px;color:var(--muted)}
nav button{font-size:17px}
nav button.active{background:#141414;color:#fff}
nav button.active svg{stroke:#fff}
nav button.active .bdg{background:#fff;color:#141414}
.kpi .v{font-size:34px}
.card{box-shadow:none;border:1px solid var(--line)}
.src{background:#faf8f5}
.fab .sw .lbl{background:rgba(255,255,255,.9);color:#141414}
.sel{font-size:16px}
/* Seguiment */
.seg{display:grid;grid-template-columns:320px 1fr;min-height:560px}
.slist{border-right:1px solid var(--line);overflow:auto;max-height:72vh}
.si{padding:14px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
.si:hover{background:#faf8f5}.si.on{background:var(--accent-s)}
.si .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.si .bdg{background:#141414;color:#fff;font-size:13px;font-weight:600;border-radius:20px;padding:1px 9px}
.sn{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.sview{padding:22px 26px;overflow:auto;max-height:72vh}
.sview h2{margin:0 0 4px;font-size:24px}
.mstat{display:flex;gap:14px;align-items:center;color:var(--muted);margin-bottom:16px}

     onOk:()=>{fs.forEach(f=>f.gest=true);ps.forEach(p=>p.gest=true);refresh();toast(`${fs.length+ps.length} factures enviades al Raül`);}});};
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const p=PAG.find(x=>x.id==b.dataset.pay);
    modal({titol:'Marcar com a pagada',ok:'Pagada',okClass:'g',cos:`<b>${h(p.prov)}</b> · ${h(p.con)}<br>${e2(p.imp)}. Queda a punt per enviar a la gestoria.`,onOk:()=>{p.pagada=TODAY;refresh();toast(`${p.prov} pagat`);}});});
  const cf=$('#cFoto');if(cf)cf.onclick=()=>{const acts=Object.values(CLI).filter(c=>c.actiu).sort((a,b)=>a.nom.localeCompare(b.nom));
    modal({titol:'Foto de la factura de compra',ok:'Desar',cos:`<div class="label">MERCERIA SABADELL<br>Factura simplificada 2026/1187 · 05/11/2026<br>Tul suau poliamida · 6 m ...... 23,40 €<br>Barnilles de cotilla · 20 u ..... 14,00 €<br>TOTAL ................................. 37,40 €</div>
     <label class="field" style="margin-top:14px"><span>Per a quin client és?</span><select id="cpCl">${acts.map(c=>`<option value="${c.code}" ${c.code==1909?'selected':''}>${c.code} · ${h(c.nom)}</option>`).join('')}</select></label>`,
     onOk:()=>{const k=+$('#cpCl').value;COMP.unshift({id:Date.now(),d:TODAY,prov:'Merceria Sabadell',con:'Tul suau i barnilles de cotilla',imp:37.40,cl:k});refresh();toast(`Compra lligada a ${C(k).nom}`);}});};
}
function aSum(){const s=perFacturar().filter(a=>af.sel.has(a.num)),t=s.reduce((x,a)=>x+aImp(a),0),n=new Set(s.map(a=>a.cl)).size;
  const el=$('#aSum');if(!el)return;el.innerHTML=s.length?`<b style="color:var(--text)">${s.length} albarans</b> · ${n} ${n===1?'client':'clients'} · ${eur(t)} sense IVA`:'Selecciona els albarans que vols facturar.';$('#aFac').disabled=!s.length;}
function facturar(){
  const s=perFacturar().filter(a=>af.sel.has(a.num));const g={};s.forEach(a=>(g[a.cl]=g[a.cl]||[]).push(a));
  const plan=Object.entries(g).map(([k,l],i)=>{const cp=COMP.filter(c=>c.cl==k&&!c.fact);return {num:String(NEXTF+i),cl:+k,l,cp,lines:[...l.flatMap(a=>a.lines.map((x,j)=>FL(j?'':a.num,x.ref,x.color,lq(x),x.p))),...cp.map(c=>FL('','COMPRA · '+c.con.toUpperCase(),'',1,c.imp))]};});
  modal({titol:`Facturar ${s.length} albarans`,ok:`Crear ${plan.length} ${plan.length===1?'factura':'factures'}`,cos:`<p>Una factura per client, amb el teu format i les condicions de pagament de cada fitxa. Les compres per refacturar s’hi afegeixen soles.</p>
   <table class="esc"><thead><tr><th>Factura</th><th>Client</th><th>Plantilla</th><th class="n">Albarans</th><th class="n">Total amb IVA</th></tr></thead><tbody>${plan.map(f=>`<tr><td class="mono">${f.num}</td><td>${h(C(f.cl).nom)}${f.cp.length?`<br><small style="color:var(--muted)">+ ${f.cp.length} compra</small>`:''}</td><td>${C(f.cl).mk==='N.I.C'?'N.I.C':'NEW OP'}</td><td class="n">${f.l.length}</td><td class="n"><b>${e2(f.lines.reduce((x,l)=>x+l.u*l.p,0)*1.21)}</b></td></tr>`).join('')}</tbody></table>`,
   onOk:()=>{plan.forEach(f=>{f.l.forEach(a=>{a.factura=f.num;a.estat='Facturat';});f.cp.forEach(c=>c.fact=f.num);FA.unshift({num:f.num,tipus:'F',data:TODAY,cl:f.cl,lines:f.lines,cobr:false,gest:false});});NEXTF+=plan.length;af.sel.clear();
     fv='gest';ensure('fac');refresh();toast(`${plan.length} ${plan.length===1?'factura creada':'factures creades'}. Ja les pots enviar al Raül`);}});
}
function openF(n){const f=FAf(n);if(!f)return;const c=C(f.cl),st=fEstat(f);
  openDrawer(`<div class="dh"><button class="x" onclick="closeDrawer()">×</button><span class="mono">${f.tipus==='PF'?'Pro-forma':'Factura'} ${f.num}</span> <span class="tag ${FST[st]}">${st}</span>${f.gest?' <span class="tag t-grey">Enviada al Raül</span>':''}<h2>${h(c.nom)} · ${e2(fTot(f))}</h2><div class="meta">${dd(f.data)} · codi ${c.code} · ${h(c.rs)}${c.nif?` · NIF ${h(c.nif)}`:''}</div></div>
   <div class="db"><div class="docwrap">${invDoc(f)}</div></div>
   <div class="df">${fEstat(f)==='Vençuda'?`<button class="btn" id="fRec">${I.mail}Recordatori de pagament</button>`:''}<button class="btn" id="fPdf">${I.pdf}Descarregar</button>${!f.cobr?`<button class="btn g" id="fCob">${I.check}${f.tipus==='PF'?'Marcar com a pagada':'Marcar com a cobrada'}</button>`:''}</div>`,true);

  const cb=$('#fCob');if(cb)cb.onclick=()=>modal({titol:f.tipus==='PF'?'Pro-forma pagada':'Factura cobrada',ok:'Confirmar',okClass:'g',cos:`${f.tipus==='PF'?'Pro-forma':'Factura'} <b>${f.num}</b> de ${h(c.nom)} per ${e2(fTot(f))}.${f.tipus==='PF'?'<br><br>Es posarà al calendari el fitting del prototip.':''}`,
   onOk:()=>{f.cobr=true;
     if(f.tipus==='PF'){ESPERA.filter(e=>e.cl==f.cl&&/pro-forma/i.test(e.que)).forEach(e=>e.rebut=true);addNote(f.cl,'Cobrament',`Pro-forma ${f.num} pagada. Comença el prototip.`,false);
       if(!AV.find(a=>a.pf===f.num))AV.push({id:Date.now(),pf:f.num,d:'2026-11-12',hr:'17:00',t:`Fitting del prototip · ${c.nom}`,x:`Prototip · pro-forma pagada el ${dd(TODAY)}`,who:`Gemma i ${c.ct}`,cat:'Clients',cl:f.cl});AV.sort((a,b)=>(a.d+a.hr).localeCompare(b.d+b.hr));}
     refresh();openF(n);toast('Cobrament registrat');}});}

/* ================= PRESSUPOSTOS ================= */
let pf={estat:'Tots',q:''};
function rPress(){
  const F_={'Tots':q=>true,'Notes rebudes':q=>q.estat==='Notes rebudes','Esborrany llest':q=>q.estat==='Esborrany llest','Sense resposta':sensResp,'Enviat':q=>q.estat==='Enviat','Acceptat':q=>q.estat==='Acceptat','Perdut':q=>q.estat==='Perdut'};
  $('#view').innerHTML=`<div class="toolbar"><div class="chips" id="pChips">${Object.keys(F_).map(k=>`<button class="chip ${pf.estat===k?'on':''}" data-k="${k}">${k}<em>${Q.filter(F_[k]).length}</em></button>`).join('')}</div><div class="spacer"></div>
   <div class="search">${I.srch}<input id="pQ" placeholder="Client, peça o número" value="${h(pf.q)}"></div>
   <button class="btn p" id="upBtn">${I.cam}Foto de la llibreta</button></div>
  <div class="card"><table><thead><tr><th>Número</th><th>Client</th><th>Models</th><th class="n">Preu per peça</th><th>Estat</th><th>Assessoria</th><th class="n">Resposta</th></tr></thead><tbody id="pBody"></tbody></table></div>`;
  $('#pChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{pf.estat=c.dataset.k;rPress();});
  $('#pQ').oninput=e=>{pf.q=e.target.value;pRows(F_);};$('#upBtn').onclick=()=>uploadNotes();pRows(F_);
}
function pRows(F_){

  const rows=Q.filter(x=>fn(x)&&(!q0||norm(`${x.num} ${C(x.cl).nom} ${C(x.cl).ct} ${qModels(x).join(' ')}`).includes(q0))).sort((a,b)=>b.num.localeCompare(a.num));
  $('#pBody').innerHTML=rows.map(x=>{const c=C(x.cl),r=qRange(x),rs=qResp(x);
   let resp='<span class="mono">—</span>';
   if(rs!=null)resp=`<span class="tag ${rs<=2?'t-ok':rs<=4?'t-warn':'t-bad'}">${rs} ${rs===1?'dia':'dies'}</span>`;
   else if(x.promes)resp=`<span class="tag t-bad">Promès per al ${dd(x.promes)}</span>`;
   else resp=`<span class="tag t-grey">Fa ${diff(x.data,TODAY)} dies</span>`;
   return `<tr data-id="${x.num}"><td class="mono">#${x.num}</td><td><b>${h(c.nom)}</b><span class="sub">${c.code} · ${h(c.ct)}</span></td>
   <td>${h(qModels(x).join(', '))||'<span class="mono">—</span>'}</td>
   <td class="n">${r?`<b>${e2(r[0])} – ${e2(r[1])}</b><span class="sub">segons volum</span>`:'<span class="mono">Per fer</span>'}</td>
   <td><span class="tag ${ESTATS[x.estat]}">${x.estat}</span>${sensResp(x)?' <span class="tag t-warn">Sense resposta</span>':''}</td><td>${dd(x.data)}<span class="sub">${x.tipus}</span></td>
   <td class="n">${resp}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Cap pressupost amb aquest filtre.</td></tr>';
  $('#pBody').querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openQ(r.dataset.id));
}
function openQ(num,tab){ensure('press');D={type:'Q',num,tab:tab||(Qf(num).lines.length?'doc':'resum')};drawQ();}
function applyTarifa(q,t){q.tarifa=t;const f=TARIFA[t].f;q.lines=q.gen.map(x=>({...x,p:x.g&&typeof x.p==='number'?Math.round(x.p*f*2)/2:x.p}));}

  else{
    if(!q.lines.length)body=`<div class="empty">Encara no hi ha pressupost. Fes-lo a partir de les notes de la reunió.</div>`;

     ${q.fonts&&q.fonts.length?`<div class="srcs"><span>Preus basats en:</span>${q.fonts.map((f,i)=>`<button class="src" data-src="${i}">${h(f[0])}</button>`).join('')}</div>`:''}
     <div class="docwrap" id="qDoc">${quoteDoc(q,ed)}</div>`;
  }
  let acts='';
  if(q.estat==='Notes rebudes')acts=`<button class="btn p" id="aMain">${I.doc}Fer el pressupost</button>`;
  else acts=`<button class="btn" id="aPdf">${I.pdf}Descarregar</button>`+(q.estat==='Esborrany llest'?`<button class="btn p" id="aMain">${I.send}Enviar pressupost</button>`:q.estat==='Enviat'?`${sensResp(q)?`<button class="btn" id="aSeg">${I.mail}Correu de seguiment</button>`:''}<button class="btn g" id="aMain">${I.check}Marcar com a acceptat</button>`:'');
  openDrawer(`<div class="dh"><button class="x" id="dX">×</button><span class="mono">#${q.num}</span> <span class="tag ${ESTATS[q.estat]}">${q.estat}</span>
   <h2>${h(c.nom)}${qModels(q).length?' · '+h(qModels(q).join(', ')):''}</h2><div class="meta">Codi ${c.code} · ${h(c.ct)} · ${h(c.em||'sense correu')} · condicions ${h(c.cond||'—')}</div></div>
   <div class="db"><div class="mini"><div><span>Models</span><b>${qModels(q).length||'—'}</b></div><div><span>Preu per peça</span><b>${r?`${num(r[0],2)}–${num(r[1],2)} €`:'—'}</b></div><div><span>Assessoria</span><b>${dd(q.data)}</b></div><div><span>${q.enviat?'Enviat':'Promès per'}</span><b>${q.enviat?dd(q.enviat):q.promes?dd(q.promes):'—'}</b></div></div>
   <div class="tabs"><button data-t="resum" class="${D.tab==='resum'?'on':''}">Resum de la reunió</button><button data-t="doc" class="${D.tab==='doc'?'on':''}">Pressupost</button></div>${body}</div>
   <div class="df">${acts}</div>`,D.tab==='doc');
  $('#dX').onclick=closeDrawer;
  document.querySelectorAll('.tabs button[data-t]').forEach(b=>b.onclick=()=>{D.tab=b.dataset.t;drawQ();});
  document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{const t=q.fonts[+b.dataset.src][1];if(t.startsWith('c'))openC(+t.slice(1));else openQ(t,'doc');});
  document.querySelectorAll('#qDoc [contenteditable]').forEach(td=>td.onblur=()=>{const l=q.lines[+td.dataset.li],f=td.dataset.f,v=td.textContent.trim();
    if(f==='p'){const n=parseFloat(v.replace(/[€\s.]/g,'').replace(',','.'));l.p=/^[\d\s.,]+€?$/.test(v)&&!isNaN(n)?n:v;}else l[f]=v;});
  const pdf=$('#aPdf');if(pdf)pdf.onclick=()=>printDoc(`Pressupost ${q.num} ${c.nom}`,quoteDoc(q,false));
  const sg=$('#aSeg');if(sg)sg.onclick=()=>modal({titol:'Correu de seguiment',ok:'Enviar',cos:`<p style="color:var(--muted);margin-top:0">Per a ${h(c.ct)} · ${h(c.em||'')}</p><textarea id="sgT" style="width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px">Hola ${h((c.ct||'').split(' ')[0])},\n\nEt vaig enviar el pressupost #${q.num} el ${dd(q.enviat)}. Com el veieu? Si voleu canviar quantitats o algun detall, el refaig sense problema.\n\nQualsevol cosa que vulgueu comentar, estic a la vostra disposició.\n\nGemma</textarea>`,
    onOk:()=>{q.seg=TODAY;addNote(q.cl,'Correu',`Correu de seguiment del pressupost #${q.num}.`,false);drawQ();refresh();toast(`Seguiment enviat a ${c.ct}`);}});
  const m=$('#aMain');if(!m)return;

    if(q.estat==='Notes rebudes'){

       onOk:()=>{m.innerHTML='<span class="spin"></span>Fent-lo…';m.disabled=true;setTimeout(()=>{applyTarifa(q,q.tarifa||'B');q.estat='Esborrany llest';D.tab='doc';drawQ();refresh();toast('Pressupost fet amb el teu format');},1000);}});

    } else if(q.estat==='Esborrany llest'){
      modal({titol:'Enviar el pressupost',ok:'Enviar a la clienta',cos:`<p>S’enviarà a <b>${h(c.ct)}</b> (${h(c.em||'correu del client')}):</p><div class="kv"><span>Pressupost</span><b>#${q.num} · ${h(c.nom)}</b><span>Models</span><b>${h(qModels(q).join(', '))}</b><span>Preu per peça</span><b>${r?`${e2(r[0])} – ${e2(r[1])}`:'—'}</b><span>Vàlid fins a</span><b>${dfull(addD(TODAY,5))}</b><span>Adjunt</span><b>Pressupost ${q.num}</b></div><p class="note" style="margin-top:14px">També el pots descarregar i enviar-lo per missatge.</p>`,

        est=q.peces*(+g.p)+pr+pt;desc=`${q.peces} u × ${e2(+g.p)} + prototip ${e2(pr)}${pt?` + patrons ${e2(pt)}`:''} = ${e2(est)}`;}
      const pfl=nou&&est?[FL('','50% PER AVANÇAR · '+qModels(q).join(', ').toUpperCase()+` (${q.peces} u)`,'',1,Math.round(est*0.5*100)/100)]:[];

       onOk:()=>{q.estat='Acceptat';if(pfl.length){FA.unshift({num:pnum,tipus:'PF',data:TODAY,cl:q.cl,lines:pfl,cobr:false,gest:false});NEXTPF++;ESPERA.push({id:Date.now(),cl:q.cl,que:`Transferència de la pro-forma ${pnum}`,des:addD(TODAY,3)});}
        addNote(q.cl,'Pressupost',`Pressupost #${q.num} acceptat.${pfl.length?` Pro-forma ${pnum} del 50% enviada.`:''}`,false);

}
function uploadNotes(pre){

    if(!l.length)return {a:'No tens cap albarà pendent de facturar.',f:[S_('Tanca del mes',()=>{fv='tanca';go('fac');})]};
    return {a:`Tens <b>${l.length} albarans entregats per facturar</b> per ${eur(t)} sense IVA:<ul>${l.map(a=>`<li>${a.num} · ${h(C(a.cl).nom)} · ${aU(a)} u · ${eur(aImp(a))}</li>`).join('')}</ul>`,f:l.slice(0,4).map(a=>S_(`Albarà ${a.num}`,()=>openA(a.num)))};}
  if(/sense preu|no.*preu/.test(n)&&/teixit|mostr|bandera/.test(n)){const l=T.filter(t=>t.preu==null);return {a:l.length?`Tens <b>${l.length} mostres sense preu</b>:<ul>${l.map(t=>`<li><b>${t.ref}</b> · ${h(t.comp)} · ${t.prov}</li>`).join('')}</ul>`:'Totes les mostres tenen preu.',f:[S_('Mostrari de teixits',()=>{tf.preu='sp';go('teix');})]};}
  if(/coto|cotons/.test(n)&&/(gram|\d{3})/.test(n)){const lim=+(n.match(/\d{3}/)||['200'])[0];const l=T.filter(t=>t.fam==='Cotó'&&t.gram>=lim).sort((a,b)=>a.gram-b.gram);
    return {a:`Tens <b>${l.length} cotons de ${lim} g/m² o més</b>:<ul>${l.map(t=>`<li><b>${t.ref}</b> · ${h(t.comp)} · ${t.gram} g/m² · ${t.preu==null?'sense preu':e2(t.preu)+'/m'} · ${t.ubic}</li>`).join('')}</ul>`,f:l.map(t=>S_(`Mostra ${t.ref}`,()=>{go('teix');openT(t.ref);}))};}
  if(/lliura|entrega/.test(n)){const l=AV.filter(a=>!a.done&&/Lliurament|Recollir|Fitting|Mostres/.test(a.t)&&diff(TODAY,a.d)>=0);return {a:`Els propers lliuraments:<ul>${l.map(a=>`<li><b>${dd(a.d)}</b> · ${h(a.t)} · ${h(a.who)}</li>`).join('')}</ul>`,f:[S_('Calendari',()=>{sf={mode:'cal',cl:null};go('seg');})]};}
  const c=findCli(q);
  if(c){
    if(/nif|cif/.test(n))return {a:`El NIF de <b>${h(c.nom)}</b> (${h(c.rs)}) és <b>${h(c.nif)||'—'}</b>.`,f:[S_(`Fitxa client ${c.code}`,()=>openC(c.code,'fitxa'))]};
    if(/condici|pagament|paga/.test(n))return {a:`<b>${h(c.nom)}</b> (codi ${c.code}) té com a condicions de pagament <b>${h(c.cond)||'cap anotada'}</b>.${c.mk?` Es factura amb la plantilla <b>${c.mk}</b>.`:''}`,f:[S_(`Fitxa client ${c.code}`,()=>openC(c.code,'fitxa'))]};
    if(/adre|on es|direcc|telef/.test(n))return {a:`<b>${h(c.nom)}</b>: ${h(c.ad)}, ${h(c.cp)}${c.tel?` · tel. ${h(c.tel)}`:''}.`,f:[S_(`Fitxa client ${c.code}`,()=>openC(c.code,'fitxa'))]};
    if(c.actiu){const d=cData(c.code);d.as=d.as.filter(a=>a.estat!=='Al taller'||1);
      return {a:`Amb <b>${h(c.nom)}</b> (${h(c.ct)}) tens:<ul>${d.qs.map(x=>`<li>Pressupost #${x.num} · ${h(qModels(x).join(', '))} · <b>${x.estat}</b></li>`).join('')}${d.as.filter(a=>!a.factura).map(a=>`<li>Albarà ${a.num} pendent de facturar · ${eur(aImp(a))}</li>`).join('')}${NOTES.filter(x=>x.cl==c.code&&x.pend&&!x.fet).map(x=>`<li>Pendent: ${h(x.text)}</li>`).join('')}${d.fs.filter(f=>!f.cobr).map(f=>`<li>${f.tipus==='PF'?'Pro-forma':'Factura'} ${f.num} · ${fEstat(f).toLowerCase()} · ${e2(fTot(f))}</li>`).join('')}</ul>`,
        f:[...d.qs.map(x=>S_(`Pressupost #${x.num}`,()=>openQ(x.num))),...d.as.filter(a=>!a.factura).map(a=>S_(`Albarà ${a.num}`,()=>openA(a.num))),S_(`Fitxa client ${c.code}`,()=>openC(c.code))].slice(0,6)};}
    return {a:`<b>${h(c.nom)}</b> és a la base (codi ${c.code}, ${h(c.pob)}), però no té moviments aquest any.`,f:[S_(`Fitxa client ${c.code}`,()=>openC(c.code,'fitxa'))]};
  }
  const w=n.split(/\s+/).filter(x=>x.length>3);const hits=[];
  Q.forEach(x=>{if(w.some(k=>norm(`${qModels(x).join(' ')} ${x.resum.join(' ')}`).includes(k)))hits.push(S_(`Pressupost #${x.num} · ${C(x.cl).nom}`,()=>openQ(x.num)));});
  T.forEach(t=>{if(w.some(k=>norm(`${t.comp} ${t.colors.join(' ')} ${t.prov}`).includes(k)))hits.push(S_(`Mostra ${t.ref}`,()=>{go('teix');openT(t.ref);}));});
  if(hits.length)return {a:`He trobat <b>${hits.length} documents</b> relacionats. Obre’ls per veure el detall.`,f:hits.slice(0,6)};
  return {a:'No he trobat res amb aquestes paraules. Prova amb el nom d’un client, un teixit, un número d’albarà o de pressupost.',f:[]};
}
function rBusc(){
  $('#view').innerHTML=`<div class="card"><div class="ask"><input id="bQ" placeholder="Pregunta-ho com ho preguntaries: quin preu vam posar a…?"><button class="btn p" id="bGo">${I.srch}Consultar</button></div><div class="sugg">${SUGG.map(s=>`<button class="chip">${s}</button>`).join('')}</div></div><div id="bRes"></div>`;
  const run=q=>{if(!q.trim())return;hist.unshift({q,...answer(q)});bDraw();$('#bQ').value='';};
  $('#bGo').onclick=()=>run($('#bQ').value);$('#bQ').onkeydown=e=>{if(e.key==='Enter')run(e.target.value);};
  document.querySelectorAll('.sugg .chip').forEach(c=>c.onclick=()=>run(c.textContent));bDraw();$('#bQ').focus();
}
function bDraw(){$('#bRes').innerHTML=hist.map((r,i)=>`<div class="card ans"><div class="q">${h(r.q)}</div><div class="a">${r.a}</div>${r.f.length?`<div class="fonts"><span>Fonts:</span>${r.f.map((f,j)=>`<button class="src" data-i="${i}" data-j="${j}">${h(f.label)}</button>`).join('')}</div>`:''}</div>`).join('');
  document.querySelectorAll('#bRes .src').forEach(b=>b.onclick=()=>hist[+b.dataset.i].f[+b.dataset.j].fn());}


$('#logo').src=LOGO;
go('inici');
</script>
